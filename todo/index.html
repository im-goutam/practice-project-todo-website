<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taskly</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <h2>Taskly</h2>
  </header>
  <main>
    <section class="heading">
      <h1>Today's Tasks</h1>
      <h3></h3>
    </section>
    <section class="add-task"><div class="task-adder-container"><input type="text" class="task-adder" placeholder="Add a new task" required>
      <button class="add">+ Add Task</button></div></div>
      <div class="Priority">Priority <button class="low-priority button">
          Low
        </button>
        <button class="medium-priority button">
          Medium
        </button>
        <button class="high-priority button">
          High
        </button>
    </section>
    <div class="popup"></div>
    <section class="capsule-button">
      <button class="all">All</button>
      <button class="active">Active</button>
      <button class="done">Done</button>
    </section>
    <section class="task-cards">
  </section>
  </main>
  <script src="script.js"></script>
</body>

</html>
